server:
  port: 8083

spring:
  application:
    name: order-service
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
        healthcheck:
          enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/toyshop_orders
    username: toyshop
    password: toyshop_secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.toyshop: DEBUG